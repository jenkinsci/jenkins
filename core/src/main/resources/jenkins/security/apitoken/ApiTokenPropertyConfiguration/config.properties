tokenGenerationOnCreationEnabled=Generate a legacy API token for each newly created user (Not recommended)
creationOfLegacyTokenEnabled=Allow users to manually create a legacy API token (Not recommended)
usageStatisticsEnabled=Enable API Token usage statistics
maxTokenLifetimeDays=Maximum lifetime of an API token (days)
exemptUserIds=Users exempt from the maximum lifetime
enforceFrom=Enforce the maximum lifetime from
enforceFromNotice=From {0}, tokens created through the HTTP endpoints must expire within {1,choice,1#1 day|1<{1} days}, unless the account is exempt. Existing tokens are not touched.

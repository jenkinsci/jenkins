ErrorTitle=The action was not done
ErrorMessage=The API token could not be changed. It may have been revoked, or may have changed, since this page was loaded. Reload the page to see the current state.
ActionsTitle=What the actions do
ActionRevoke=Revoke deletes the token. When its secret is shared with other tokens of the same user, every one of them that has not expired is revoked too, \
  as the secret would keep working otherwise. The tokens that have expired are kept: they cannot be used, and while they exist the same secret cannot be registered again.
ActionShorten=Shorten to maximum sets the expiration date of a token that does not comply to today plus the maximum lifetime. It never makes a date later. \
  The other tokens that share its secret are not changed: each one is listed on its own if it does not comply.
ActionLegacy=A legacy token has no expiration date and cannot be given one, so only Revoke is offered for it.
ActionOtherPages=Only Revoke on this page removes every token that has the same secret. Revoking a token from the page of the user, or from the page of the legacy API token usage, \
  removes that token only and leaves the others that have the same secret.
ActionAgain=Each action looks at the token again when it is done, not as this page showed it: Revoke removes the tokens that share its secret at that moment. \
  An action that no longer applies, because the token was revoked, or because Shorten finds that the token complies now or has expired, changes nothing and the page says so. \
  Reload the page to see the current state.
StatisticsNote=Usage statistics are kept for each token. When several tokens share a secret, a use is counted for the first of them, \
  so a token can show that it was never used while its secret is in use by another one.

title=API token maximum lifetime
breadcrumb=Manage
blurb=This page lists the API tokens that do not comply with the maximum lifetime that is configured under Security, \
  and the secrets that several tokens of one user share. Nothing is rejected, expired or revoked automatically: \
  the tokens that existed before the maximum was set, the legacy tokens, which never expire, and the tokens that scripts create \
  are only listed here, and an administrator decides what to do with each of them.
